[project]
name = "netherlands-renting-assistant"
description = "Scrapes Dutch rental websites and sends listings to Telegram"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Isolated fast unit tests with mocks",
    "integration: Integration tests requiring external APIs or live network",
]
