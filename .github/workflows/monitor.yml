name: Housing Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
        - master
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape on Render
        run: |
          curl -s -X POST "https://nra_bot.onrender.com/webhook" \
            -H "Content-Type: application/json" \
            -d '{"update_id": 1, "message": {"message_id": 1, "from": {"id": ${{ secrets.TELEGRAM_CHAT_ID }}, "is_bot": false, "first_name": "Cron"}, "chat": {"id": ${{ secrets.TELEGRAM_CHAT_ID }}, "type": "private"}, "date": 0, "text": "/scrape"}}'