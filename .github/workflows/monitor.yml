name: Housing Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
        - master
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup & Run Obscura Browser
        run: |
          mkdir -p "$HOME/.obscura/bin"
          curl -sL https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz | tar -xz -C "$HOME/.obscura/bin"
          chmod +x "$HOME/.obscura/bin/"*
          echo "$HOME/.obscura/bin" >> $GITHUB_PATH
          "$HOME/.obscura/bin/obscura" serve --port 9222 --stealth &
          sleep 2

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OBSCURA_CDP_URL: http://127.0.0.1:9222
        run: python main.py
